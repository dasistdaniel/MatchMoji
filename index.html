<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a1333">
  <title>MatchMoji</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MatchMoji">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <canvas id="cv"></canvas>

    <div id="menu" class="screen">
      <div class="col">
        <h1><img class="title-logo" src="logo/matchmoji-wordmark-gold.svg" alt="MatchMoji"></h1>
        <p class="sub">Tausche Emojis – 3 in einer Reihe!</p>
        <p class="hint">4er → ⚡ Linien-Blitz &nbsp; · &nbsp; 5er → 🌟 Super-Stern</p>

        <div class="mode">
          <button id="btnNormal" class="btn">🎯 Normal</button>
          <div id="bestNormal" class="best"></div>
        </div>
        <div class="mode">
          <button id="btnTA" class="btn">⏱ Time Attack</button>
          <div id="bestTA" class="best"></div>
        </div>
        <div class="mode">
          <button id="btnEndless" class="btn">♾ Endlos</button>
          <div id="bestEndless" class="best"></div>
        </div>
        <div class="mode">
          <button id="btnClear" class="btn">🧹 Abräumen</button>
          <div id="bestClear" class="best"></div>
        </div>

        <div class="mode settings-entry">
          <button id="btnSettings" class="btn secondary">⚙️ Einstellungen</button>
          <div id="menuTheme" class="best"></div>
        </div>
      </div>
      <div class="footer">
        <span id="version"></span> · <a href="https://github.com/dasistdaniel/MatchMoji" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>

    <div id="settings" class="screen">
      <div class="col">
        <h2>Einstellungen</h2>

        <div class="themes">
          <button id="themePrev" class="btn round">◀</button>
          <div class="theme-mid">
            <div class="theme-label">Thema</div>
            <div id="themeName" class="theme-name"></div>
            <div id="themePreview" class="theme-preview emoji"></div>
          </div>
          <button id="themeNext" class="btn round">▶</button>
        </div>

        <div class="section-label">Ton <span class="section-hint">· Symbol antippen zum An-/Ausschalten</span></div>
        <div class="vol">
          <div class="vol-row"><button id="btnMusic" class="iconbtn" aria-label="Musik an/aus">🎵</button><div id="volMusic" class="slider"><div class="track"><div class="fill"></div></div><div class="knob"></div></div><span class="pct"></span></div>
          <div class="vol-row"><button id="btnSound" class="iconbtn" aria-label="Soundeffekte an/aus">🔊</button><div id="volSfx" class="slider"><div class="track"><div class="fill"></div></div><div class="knob"></div></div><span class="pct"></span></div>
        </div>

        <div class="toggles">
          <button id="tglHints" class="toggle" aria-pressed="true"><span>💡 Hinweise</span><span class="sw"></span></button>
          <button id="tglVibrate" class="toggle" aria-pressed="true"><span>📳 Vibration</span><span class="sw"></span></button>
        </div>

        <div class="themes track-box">
          <button id="trackPrev" class="btn round small">◀</button>
          <div class="theme-mid">
            <div class="theme-label">Musik</div>
            <div id="trackName" class="track-name"></div>
          </div>
          <button id="trackNext" class="btn round small">▶</button>
        </div>

        <button id="btnInstall" class="btn secondary install" hidden>📲 Als App installieren</button>
        <div id="installHint" class="install-hint" hidden>Als App: im Browser <b>Teilen</b> → <b>„Zum Home-Bildschirm“</b></div>

        <button id="btnBack" class="btn back">Zurück</button>
      </div>
    </div>

    <button id="btnQuit" class="flat" style="left:12px;top:22px" aria-label="Zum Menü">✕</button>
    <button id="btnPause" class="flat" style="left:70px;top:22px" aria-label="Pause">⏸️</button>

    <div id="pause" class="screen">
      <div class="col">
        <div class="emoji" style="font-size:96px">⏸️</div>
        <div class="over-title">Pause</div>
        <button id="btnResume" class="btn">▶ Weiter</button>
        <button id="btnPauseMenu" class="btn secondary">Menü</button>
      </div>
    </div>

    <div id="over" class="screen">
      <div class="col">
        <div id="overEmoji" class="emoji" style="font-size:96px">⏰</div>
        <div id="overTitle" class="over-title">Zeit um!</div>
        <div id="overStars" class="over-stars emoji"></div>
        <div id="overScore" class="over-score"></div>
        <div id="overBest" class="over-best"></div>
        <button id="btnAgain" class="btn">Nochmal</button>
        <button id="btnMenu" class="btn">Menü</button>
      </div>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
